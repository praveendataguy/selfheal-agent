# Push this folder as a new GitLab project, point its Pipeline webhook at the agent,
# and push to a feature branch: the planted bug fails `unit`, and the agent should
# open a self-heal MR fixing src/pricing.py (not the test).
stages: [test]

unit:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -q pytest
    - python -m pytest -q
